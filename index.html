<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Matriks Rotasi 3D (TMA111)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f0f0;
      }
      #ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 350px;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        color: #333;
        border-bottom: 2px solid #0056b3;
        padding-bottom: 5px;
      }
      .control-group {
        margin-bottom: 15px;
      }
      .control-group label {
        display: block;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
      }
      .control-group input[type="range"] {
        width: 100%;
        cursor: pointer;
      }

      .matrix-display {
        margin-top: 15px;
        font-family: monospace;
        font-size: 16px;
        border-collapse: collapse;
        width: 100%;
        background: #fff;
      }
      .matrix-display td {
        padding: 8px;
        border: 1px solid #ccc;
        text-align: center;
        width: 33.33%;
      }
      .legend {
        font-size: 12px;
        margin-top: 20px;
        color: #555;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="ui-panel">
      <h3>Kontrol Sudut Rotasi (Derajat)</h3>

      <div class="control-group">
        <label style="color: red"
          >Roll (Sumbu X_L): <span id="valX">0</span>°</label
        >
        <input type="range" id="roll" min="-180" max="180" value="0" />
      </div>

      <div class="control-group">
        <label style="color: green"
          >Pitch (Sumbu Y_L): <span id="valY">0</span>°</label
        >
        <input type="range" id="pitch" min="-180" max="180" value="0" />
      </div>

      <div class="control-group">
        <label style="color: blue"
          >Yaw (Sumbu Z_L): <span id="valZ">0</span>°</label
        >
        <input type="range" id="yaw" min="-180" max="180" value="0" />
      </div>

      <h3>Matriks Rotasi 3D (R)</h3>
      <table class="matrix-display" id="rotMatrix">
        <tr>
          <td id="m00">1.000</td>
          <td id="m01">0.000</td>
          <td id="m02">0.000</td>
        </tr>
        <tr>
          <td id="m10">0.000</td>
          <td id="m11">1.000</td>
          <td id="m12">0.000</td>
        </tr>
        <tr>
          <td id="m20">0.000</td>
          <td id="m21">0.000</td>
          <td id="m22">1.000</td>
        </tr>
      </table>

      <div class="legend">
        <strong>Keterangan Visual:</strong><br />
        <strong>Garis Tebal (Menerus)</strong> = Frame GLOBAL<br />
        <strong>Garis Putus-Putus</strong> = Frame LOKAL<br />
        <span style="background: red"></span> Sumbu X |
        <span style="background: green"></span> Sumbu Y |
        <span style="background: blue"></span> Sumbu Z
      </div>
    </div>

    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe0e5ec);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.up.set(0, 0, 1);
      camera.position.set(6, 6, 5);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      function createTextLabel(mainText, subText, color) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const context = canvas.getContext("2d");

        context.fillStyle = color;
        context.textAlign = "center";
        context.textBaseline = "middle";

        context.font = "Bold 90px Arial";
        context.fillText(mainText, 100, 128);

        context.font = "Bold 60px Arial";
        context.fillText(subText, 150, 150);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMaterial);

        sprite.scale.set(0.8, 0.8, 1);
        return sprite;
      }

      const globalFrame = new THREE.Group();
      const origin = new THREE.Vector3(0, 0, 0);

      function createSolidArrow(dir, color) {
        return new THREE.ArrowHelper(dir, origin, 3.5, color, 0.3, 0.15);
      }

      const gArrowX = createSolidArrow(new THREE.Vector3(1, 0, 0), 0x990000); // Merah tua
      const gArrowY = createSolidArrow(new THREE.Vector3(0, 1, 0), 0x007700); // Hijau tua
      const gArrowZ = createSolidArrow(new THREE.Vector3(0, 0, 1), 0x000099); // Biru tua

      const gLabelX = createTextLabel("X", "G", "#990000");
      gLabelX.position.set(3.8, 0, 0);
      const gLabelY = createTextLabel("Y", "G", "#007700");
      gLabelY.position.set(0, 3.8, 0);
      const gLabelZ = createTextLabel("Z", "G", "#000099");
      gLabelZ.position.set(0, 0, 3.8);

      globalFrame.add(gArrowX, gArrowY, gArrowZ, gLabelX, gLabelY, gLabelZ);
      scene.add(globalFrame);

      const localFrame = new THREE.Group();

      function createDashedArrow(dir, color) {
        const length = 2.8;
        const group = new THREE.Group();

        const material = new THREE.LineDashedMaterial({
          color: color,
          linewidth: 2,
          scale: 1,
          dashSize: 0.15,
          gapSize: 0.15,
        });

        const points = [
          new THREE.Vector3(0, 0, 0),
          dir.clone().multiplyScalar(length - 0.4),
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        line.computeLineDistances();

        const coneGeo = new THREE.ConeGeometry(0.12, 0.4, 8);
        const coneMat = new THREE.MeshBasicMaterial({ color: color });
        const cone = new THREE.Mesh(coneGeo, coneMat);

        cone.position.copy(dir.clone().multiplyScalar(length - 0.2));

        const axis = new THREE.Vector3(0, 1, 0);
        cone.quaternion.setFromUnitVectors(axis, dir);

        group.add(line, cone);
        return group;
      }

      const lArrowX = createDashedArrow(new THREE.Vector3(1, 0, 0), 0xff0000); // Merah terang
      const lArrowY = createDashedArrow(new THREE.Vector3(0, 1, 0), 0x00cc00); // Hijau terang
      const lArrowZ = createDashedArrow(new THREE.Vector3(0, 0, 1), 0x0066ff); // Biru terang

      const lLabelX = createTextLabel("X", "L", "#ff0000");
      lLabelX.position.set(3.0, 0, 0);
      const lLabelY = createTextLabel("Y", "L", "#00cc00");
      lLabelY.position.set(0, 3.0, 0);
      const lLabelZ = createTextLabel("Z", "L", "#0066ff");
      lLabelZ.position.set(0, 0, 3.0);

      localFrame.add(lArrowX, lArrowY, lArrowZ, lLabelX, lLabelY, lLabelZ);
      scene.add(localFrame);

      const inputs = {
        roll: document.getElementById("roll"),
        pitch: document.getElementById("pitch"),
        yaw: document.getElementById("yaw"),
      };

      const labels = {
        x: document.getElementById("valX"),
        y: document.getElementById("valY"),
        z: document.getElementById("valZ"),
      };

      function updateSimulation() {
        const rDeg = parseFloat(inputs.roll.value);
        const pDeg = parseFloat(inputs.pitch.value);
        const yDeg = parseFloat(inputs.yaw.value);

        labels.x.innerText = rDeg;
        labels.y.innerText = pDeg;
        labels.z.innerText = yDeg;

        const rRad = THREE.MathUtils.degToRad(rDeg);
        const pRad = THREE.MathUtils.degToRad(pDeg);
        const yRad = THREE.MathUtils.degToRad(yDeg);

        localFrame.quaternion.identity();
        const qRoll = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(1, 0, 0),
          rRad,
        );
        const qPitch = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0),
          pRad,
        );
        const qYaw = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 0, 1),
          yRad,
        );

        localFrame.quaternion.multiply(qYaw);
        localFrame.quaternion.multiply(qPitch);
        localFrame.quaternion.multiply(qRoll);

        localFrame.updateMatrix();

        const me = localFrame.matrix.elements;

        const formatNum = (num) => (num + 0).toFixed(3);

        document.getElementById("m00").innerText = formatNum(me[0]);
        document.getElementById("m10").innerText = formatNum(me[1]);
        document.getElementById("m20").innerText = formatNum(me[2]);

        document.getElementById("m01").innerText = formatNum(me[4]);
        document.getElementById("m11").innerText = formatNum(me[5]);
        document.getElementById("m21").innerText = formatNum(me[6]);

        document.getElementById("m02").innerText = formatNum(me[8]);
        document.getElementById("m12").innerText = formatNum(me[9]);
        document.getElementById("m22").innerText = formatNum(me[10]);
      }

      inputs.roll.addEventListener("input", updateSimulation);
      inputs.pitch.addEventListener("input", updateSimulation);
      inputs.yaw.addEventListener("input", updateSimulation);

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      updateSimulation();
    </script>
  </body>
</html>
