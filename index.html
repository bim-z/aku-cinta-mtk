<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Matriks Rotasi 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f0f0;
      }
      #ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 320px;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        color: #333;
        border-bottom: 2px solid #0056b3;
        padding-bottom: 5px;
      }
      .control-group {
        margin-bottom: 15px;
      }
      .control-group label {
        display: block;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
      }
      .control-group input[type="range"] {
        width: 100%;
        cursor: pointer;
      }

      .matrix-display {
        margin-top: 15px;
        font-family: monospace;
        font-size: 16px;
        border-collapse: collapse;
        width: 100%;
        background: #fff;
      }
      .matrix-display td {
        padding: 8px;
        border: 1px solid #ccc;
        text-align: center;
        width: 33.33%;
      }
      .legend {
        font-size: 12px;
        margin-top: 20px;
        color: #555;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="ui-panel">
      <h3>Kontrol Sudut Rotasi (Derajat)</h3>

      <div class="control-group">
        <label style="color: red"
          >Roll (Sumbu X): <span id="valX">0</span>°</label
        >
        <input type="range" id="roll" min="-180" max="180" value="0" />
      </div>

      <div class="control-group">
        <label style="color: green"
          >Pitch (Sumbu Y): <span id="valY">0</span>°</label
        >
        <input type="range" id="pitch" min="-180" max="180" value="0" />
      </div>

      <div class="control-group">
        <label style="color: blue"
          >Yaw (Sumbu Z): <span id="valZ">0</span>°</label
        >
        <input type="range" id="yaw" min="-180" max="180" value="0" />
      </div>

      <h3>Matriks Rotasi 3D (R)</h3>
      <table class="matrix-display" id="rotMatrix">
        <tr>
          <td id="m00">1.000</td>
          <td id="m01">0.000</td>
          <td id="m02">0.000</td>
        </tr>
        <tr>
          <td id="m10">0.000</td>
          <td id="m11">1.000</td>
          <td id="m12">0.000</td>
        </tr>
        <tr>
          <td id="m20">0.000</td>
          <td id="m21">0.000</td>
          <td id="m22">1.000</td>
        </tr>
      </table>

      <div class="legend">
        <strong>Keterangan Visual:</strong><br />
        Garis Tipis = Frame GLOBAL (Tetap)<br />
        Panah Tebal = Frame LOKAL (Berotasi)<br />
        <span style="background: red"></span> Sumbu X |
        <span style="background: green"></span> Sumbu Y |
        <span style="background: blue"></span> Sumbu Z
      </div>
    </div>

    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe0e5ec);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.up.set(0, 0, 1);
      camera.position.set(5, 5, 4);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const globalAxes = new THREE.AxesHelper(3);
      globalAxes.material.transparent = true;
      globalAxes.material.opacity = 0.3;
      scene.add(globalAxes);

      const localFrame = new THREE.Group();
      const origin = new THREE.Vector3(0, 0, 0);
      const arrowX = new THREE.ArrowHelper(
        new THREE.Vector3(1, 0, 0),
        origin,
        2.5,
        0xff0000,
        0.4,
        0.25,
      );
      const arrowY = new THREE.ArrowHelper(
        new THREE.Vector3(0, 1, 0),
        origin,
        2.5,
        0x00ff00,
        0.4,
        0.25,
      );
      const arrowZ = new THREE.ArrowHelper(
        new THREE.Vector3(0, 0, 1),
        origin,
        2.5,
        0x0000ff,
        0.4,
        0.25,
      );

      localFrame.add(arrowX, arrowY, arrowZ);
      scene.add(localFrame);

      const inputs = {
        roll: document.getElementById("roll"),
        pitch: document.getElementById("pitch"),
        yaw: document.getElementById("yaw"),
      };

      const labels = {
        x: document.getElementById("valX"),
        y: document.getElementById("valY"),
        z: document.getElementById("valZ"),
      };

      function updateSimulation() {
        const rDeg = parseFloat(inputs.roll.value);
        const pDeg = parseFloat(inputs.pitch.value);
        const yDeg = parseFloat(inputs.yaw.value);

        labels.x.innerText = rDeg;
        labels.y.innerText = pDeg;
        labels.z.innerText = yDeg;

        const rRad = THREE.MathUtils.degToRad(rDeg);
        const pRad = THREE.MathUtils.degToRad(pDeg);
        const yRad = THREE.MathUtils.degToRad(yDeg);

        localFrame.quaternion.identity();

        const qRoll = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(1, 0, 0),
          rRad,
        );
        const qPitch = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0),
          pRad,
        );
        const qYaw = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 0, 1),
          yRad,
        );

        localFrame.quaternion.multiply(qYaw);
        localFrame.quaternion.multiply(qPitch);
        localFrame.quaternion.multiply(qRoll);

        localFrame.updateMatrix();

        const me = localFrame.matrix.elements;

        document.getElementById("m00").innerText = me[0].toFixed(3);
        document.getElementById("m10").innerText = me[1].toFixed(3);
        document.getElementById("m20").innerText = me[2].toFixed(3);

        document.getElementById("m01").innerText = me[4].toFixed(3);
        document.getElementById("m11").innerText = me[5].toFixed(3);
        document.getElementById("m21").innerText = me[6].toFixed(3);

        document.getElementById("m02").innerText = me[8].toFixed(3);
        document.getElementById("m12").innerText = me[9].toFixed(3);
        document.getElementById("m22").innerText = me[10].toFixed(3);
      }

      inputs.roll.addEventListener("input", updateSimulation);
      inputs.pitch.addEventListener("input", updateSimulation);
      inputs.yaw.addEventListener("input", updateSimulation);

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
